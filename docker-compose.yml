services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polycloud}
      POSTGRES_USER: ${POSTGRES_USER:-polycloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polycloud}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polycloud} -d ${POSTGRES_DB:-polycloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://polycloud:polycloud@postgres:5432/polycloud?sslmode=disable}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RCLONE_CONFIG_PATH: ${RCLONE_CONFIG_PATH:-/config/rclone/rclone.conf}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:3000/connect/callback}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - rclone_config:/config/rclone

  frontend:
    build: ./apps/frontend
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  rclone_config:
